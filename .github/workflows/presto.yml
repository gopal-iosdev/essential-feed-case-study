name: Presto

on:
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: presto-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: aryamansharda/presto-build@v1
        with:
          scheme: "EssentialApp"
          configuration: "Debug"
          workspace: "EssentialApp.xcworkspace"
          app-name: "EssentialApp"